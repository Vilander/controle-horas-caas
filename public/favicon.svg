<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AS&amp;V Horas" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000080"/>
      <stop offset="1" stop-color="#71226B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Anel do relógio (trilha) -->
  <circle cx="256" cy="268" r="148" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="30"/>
  <!-- Anel de progresso: horas consumidas (75%) -->
  <circle cx="256" cy="268" r="148" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round"
          stroke-dasharray="697 930" transform="rotate(-90 256 268)"/>

  <!-- Ponteiros em formato de trilha de circuito (referência ao logo) -->
  <path d="M256 268 V196 L322 150" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nós do circuito, como no logo -->
  <circle cx="256" cy="268" r="20" fill="#0D0D11" stroke="#fff" stroke-width="12"/>
  <circle cx="322" cy="150" r="20" fill="#0D0D11" stroke="#fff" stroke-width="12"/>
  <circle cx="256" cy="120" r="0" fill="none"/>
</svg>
